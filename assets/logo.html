<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
// thir logo: the wallpaper's bear head (assets/wallpaper.html bearHead) on a warm charcoal tile. ?s=size
const S = +(new URLSearchParams(location.search).get('s') || 512), c = document.getElementById('c');
c.width = c.height = S;
const g = c.getContext('2d'), u = S / 512;
const tile = new Path2D(); tile.roundRect(24 * u, 24 * u, 464 * u, 464 * u, 104 * u);
const bg = g.createRadialGradient(256 * u, 470 * u, 0, 256 * u, 470 * u, 520 * u);
bg.addColorStop(0, '#2a2125'); bg.addColorStop(0.55, '#171315'); bg.addColorStop(1, '#0c0a0b');
g.fillStyle = bg; g.fill(tile);
g.strokeStyle = 'rgba(224,184,168,0.35)'; g.lineWidth = 3 * u; g.stroke(tile);
const stroke = '#e0b8a8', fill = '#171315', cx = 256 * u, cy = 236 * u, r = 118 * u;
g.lineWidth = 14 * u; g.strokeStyle = stroke; g.fillStyle = fill; g.lineJoin = 'round';
for (const sx of [-1, 1]) { g.beginPath(); g.arc(cx + sx * 0.7 * r, cy - 0.72 * r, 0.36 * r, 0, 7); g.fill(); g.stroke(); }
g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill(); g.stroke();
g.beginPath(); g.ellipse(cx, cy + 0.34 * r, 0.42 * r, 0.3 * r, 0, 0, 7); g.stroke();
g.fillStyle = stroke;
g.beginPath(); g.ellipse(cx, cy + 0.24 * r, 0.13 * r, 0.09 * r, 0, 0, 7); g.fill();
for (const sx of [-1, 1]) { g.beginPath(); g.arc(cx + sx * 0.36 * r, cy - 0.12 * r, 0.065 * r, 0, 7); g.fill(); }
g.font = `600 ${58 * u}px "SF Mono", Menlo, monospace`; g.textAlign = 'center'; g.letterSpacing = `${14 * u}px`;
g.fillStyle = '#ecd6cd'; g.fillText('thir', cx + 7 * u, 432 * u);
</script>
