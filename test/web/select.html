<!doctype html><meta charset=utf-8><title>select</title>
<body style="margin:0;background:rgb(10,20,200);font:24px sans-serif">
<select id=s style="position:absolute;left:20px;top:20px;width:300px;height:44px;font-size:24px" onchange="if(this.value==='plum'){document.body.style.background='rgb(30,160,40)';document.title='picked-plum'}">
<option value=apple>Apple</option><option value=pear>Pear</option><option value=plum>Plum</option><option value=fig>Fig</option></select>
